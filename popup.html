<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Sound Meters</title>
  <style>
    html,body { margin:0; background:#000; overflow:hidden; }

    #controls {
      display:flex;
      align-items:center;
      gap:8px;
      width:640px;
      padding:8px 10px;
      box-sizing:border-box;
      background:#111;
      color:#ddd;
      font:13px/1 system-ui,sans-serif;
    }

    #controls button {
      background:#1b1b1b;
      color:#eee;
      border:1px solid #333;
      border-radius:4px;
      padding:4px 10px;
      cursor:pointer;
    }

    #controls button:hover {
      background:#2a2a2a;
    }

    #controls button:disabled {
      opacity:0.6;
      cursor:default;
    }

    #controls select {
      background:#1b1b1b;
      color:#eee;
      border:1px solid #333;
      border-radius:4px;
      padding:4px 6px;
      cursor:pointer;
      font:inherit;
    }

    #controls label {
      opacity:0.7;
      font-size:12px;
    }

    #status {
      opacity:0.8;
    }

    .spacer {
      flex:1;
    }

    /* Put canvases side-by-side */
    #meters {
      display:flex;
      width:640px;
      height:160px;
    }

    canvas {
      flex:1;
      display:block;
      width:320px; height:160px;
    }

    #err {
      padding:12px;
      font:14px/1.4 system-ui,sans-serif;
      color:#ff5252;
    }
  </style>
</head>
<body>
  <div id="controls">
    <button id="toggle">Start</button>
    <span id="status">Idle</span>
    <span class="spacer"></span>
    <label for="waveMode">Waveform:</label>
    <select id="waveMode">
      <option value="oscilloscope">Oscilloscope</option>
      <option value="scrolling">Scrolling</option>
    </select>
  </div>

  <div id="meters">
    <canvas id="spec"></canvas>
    <canvas id="wave"></canvas>
  </div>

  <div id="err" hidden></div>

  <script type="module" src="popup.js"></script>
</body>
</html>
